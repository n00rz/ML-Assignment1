<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insurance ML App</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f3f4f6; margin: 0; padding: 24px; color: #111827; }
  h1 { text-align: center; }
  .wrap { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .card { background: #fff; padding: 24px; border-radius: 12px; width: 340px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  label { display: block; margin-top: 12px; font-size: 14px; font-weight: 600; }
  input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 6px; }
  button { margin-top: 18px; width: 100%; padding: 10px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; font-size: 16px; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  .result { margin-top: 16px; padding: 12px; background: #eff6ff; border-radius: 6px; font-weight: 600; min-height: 20px; }
  .error { background: #fef2f2; color: #b91c1c; }
</style>
</head>
<body>
<h1>Insurance ML App</h1>
<div class="wrap">

  <!-- Regression form -->
  <form class="card" id="regForm">
    <h2>Predict Charges</h2>
    <label>Age <input type="number" name="age" value="35" min="18" max="100" required></label>
    <label>Sex <select name="sex"><option>male</option><option>female</option></select></label>
    <label>BMI <input type="number" step="0.1" name="bmi" value="27.5" required></label>
    <label>Children <input type="number" name="children" value="1" min="0" max="10" required></label>
    <label>Smoker <select name="smoker"><option>no</option><option>yes</option></select></label>
    <label>Region <select name="region"><option>northeast</option><option>northwest</option><option>southeast</option><option>southwest</option></select></label>
    <button type="submit">Predict</button>
    <div class="result" id="regResult"></div>
  </form>

  <!-- Classification form -->
  <form class="card" id="clfForm">
    <h2>Is this person a smoker?</h2>
    <label>Age <input type="number" name="age" value="35" min="18" max="100" required></label>
    <label>Sex <select name="sex"><option>male</option><option>female</option></select></label>
    <label>BMI <input type="number" step="0.1" name="bmi" value="27.5" required></label>
    <label>Children <input type="number" name="children" value="1" min="0" max="10" required></label>
    <label>Region <select name="region"><option>northeast</option><option>northwest</option><option>southeast</option><option>southwest</option></select></label>
    <label>Charges ($) <input type="number" step="0.01" name="charges" value="30000" required></label>
    <button type="submit">Classify</button>
    <div class="result" id="clfResult"></div>
  </form>

</div>

<script>

const API = "http://127.0.0.1:8000";

async function send(form, url, resultEl, format) {
  const data = Object.fromEntries(new FormData(form));
  for (const k of ["age", "children"]) if (k in data) data[k] = parseInt(data[k]);
  for (const k of ["bmi", "charges"]) if (k in data) data[k] = parseFloat(data[k]);
  resultEl.className = "result";
  resultEl.textContent = "Loading...";
  try {
    const res = await fetch(API + url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
    });
    if (!res.ok) throw new Error("Invalid input or server error");
    resultEl.textContent = format(await res.json());
  } catch (err) {
    resultEl.className = "result error";
    resultEl.textContent = "Error: " + err.message;
  }
}

document.getElementById("regForm").addEventListener("submit", e => {
  e.preventDefault();
  send(e.target, "/predict/regression", document.getElementById("regResult"),
       r => "Predicted charges: $" + r.predicted_charges.toLocaleString());
});

document.getElementById("clfForm").addEventListener("submit", e => {
  e.preventDefault();
  send(e.target, "/predict/classification", document.getElementById("clfResult"),
       r => (r.is_smoker ? "Smoker" : "Non-smoker") + " (confidence " + (r.confidence * 100).toFixed(1) + "%)");
});
</script>
</body>
</html>
